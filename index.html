<html>

    <head>
        <meta charset="utf-8" />
        <title>messagerie</title>
        <meta
              name="description"
              content="Blabla" /> 
        <link 
              rel="stylesheet"
              href="Messagerie.css" />
        <script src="Messagerie.js" defer></script>
    </head>
<!-- En ligne -->

    <body class="home-page">
        <button
            type="button"
            class="settings-toggle"
            id="settings-toggle"
            aria-label="Ouvrir les paramètres"
            aria-expanded="false"
            aria-controls="settings-sidebar"
            title="Paramètres">⚙</button>

        <h1><ins>Messagerie Personnelle</ins></h1>

        <p>
            <marquee><strong><i><span id="welcome-message">Bienvenue</span></i></strong></marquee>
        </p>

        <section class="home-access" aria-label="Accéder à la messagerie">
            <form action="conversation.html">
                <p>
                    <label for="courriel">Email :</label>
                    <input required
                           type="email"
                           id="courriel"
                           autocomplete="email" />
                </p>
                <p>
                    <label for="password">Mot de passe :</label>
                    <input
                           type="password"
                           id="password"
                           autocomplete="current-password"
                           required />
                    <label class="password-visibility">
                        <input type="checkbox" onclick="showpassword()" />
                        Afficher le mot de passe
                    </label>
                </p>
                <p>
                    <button class="conversation-access-button" type="submit">Accéder</button>
                </p>
            </form>
        </section>

        <aside
            id="settings-sidebar"
            class="settings-sidebar"
            aria-label="Paramètres"
            aria-hidden="true"
            inert>
            <div class="contacts-sidebar-header">
                <h2>Paramètres</h2>
                <button
                    type="button"
                    id="settings-close"
                    class="settings-close"
                    aria-label="Fermer les paramètres">×</button>
            </div>
            <iframe src="parametres.html" title="Réglages de la messagerie"></iframe>
        </aside>
    </body>

<foot>
</foot>
</html>
