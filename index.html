<!doctype html>
<html lang="fr">

    <head>
        <meta charset="utf-8" />
        <title>Connexion</title>
        <meta
              name="description"
              content="Blabla" />
        <link
              rel="stylesheet"
              href="Messagerie.css" />
        <script src="Messagerie.js" defer></script>
        <script type="module" src="supabase.js"></script>
    </head>
    <body class="home-page">
        <button
            type="button"
            class="settings-toggle"
            id="settings-toggle"
            aria-label="Ouvrir les paramètres"
            aria-expanded="false"
            aria-controls="settings-sidebar"
            title="Paramètres">⚙</button>

        <h1><ins>Messagerie Personnelle</ins></h1>

        <p>
            <marquee><strong><i><span id="welcome-message">Bienvenue</span></i></strong></marquee>
        </p>

        <section class="home-access" aria-label="Accéder à la messagerie">
            <form id="login-form">
                <p>
                    <label for="courriel">Email :</label>
                    <input required
                           type="email"
                           id="courriel"
                           name="email"
                           autocomplete="email" />
                </p>
                <p id="signup-username-field" hidden>
                    <label for="signup-username">Nom d’utilisateur :</label>
                    <input
                           type="text"
                           id="signup-username"
                           name="username"
                           autocomplete="username"
                           minlength="3"
                           maxlength="30"
                           pattern="[A-Za-z0-9_]+"
                           title="Utilisez de 3 à 30 lettres, chiffres ou traits de soulignement." />
                </p>
                <p>
                    <label for="password">Mot de passe :</label>
                    <input
                           type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           required />
                    <label class="password-visibility">
                        <input type="checkbox" onclick="togglePasswordVisibility()" />
                        Afficher le mot de passe
                    </label>
                </p>
                <p>
                    <button id="login-submit" class="conversation-access-button" type="submit">Accéder</button>
                    <button id="signup-submit" class="conversation-access-button" type="submit" hidden>Créer</button>
                </p>
                <p>
                    <button id="auth-mode-toggle" class="auth-mode-toggle" type="button">Créer un compte</button>
                </p>
                <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <aside
            id="settings-sidebar"
            class="settings-sidebar"
            aria-label="Paramètres"
            aria-hidden="true"
            inert>
            <div class="contacts-sidebar-header">
                <h2>Paramètres</h2>
                <button
                    type="button"
                    id="settings-close"
                    class="settings-close"
                    aria-label="Fermer les paramètres">×</button>
            </div>
            <iframe src="parametres.html" title="Réglages de la messagerie"></iframe>
        </aside>
    </body>
</html>
