<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Conversations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="Messagerie.css" />
    <script src="Messagerie.js" defer></script>
</head>
<body class="conversation-page">
    <aside class="contacts-sidebar" aria-label="Mes contacts">
        <div class="contacts-sidebar-header">
            <h2>Mes contacts</h2>
        </div>
        <iframe src="contacts.html" title="Liste de mes contacts"></iframe>
        <button
            type="button"
            class="contacts-resize-handle"
            aria-label="Redimensionner la barre des contacts"></button>
    </aside>

    <main class="conversation-main">
        <button
            type="button"
            class="settings-toggle"
            id="settings-toggle"
            aria-label="Ouvrir les paramètres"
            aria-expanded="false"
            aria-controls="settings-sidebar"
            title="Paramètres">⚙            </button>
            <h1 id="conversation-title">Conversation</h1>
            <section
            id="conversation-messages"
            class="conversation-messages"
            aria-label="Messages de la conversation"
            aria-live="polite">
        </section>
        <form id="message-form">
            <div class="message-composer">
                <input type="text" id="message" name="message" aria-label="Message" autocomplete="off" />
            </div>
        </form>
    </main>
    <aside
        id="settings-sidebar"
        class="settings-sidebar"
        aria-label="Paramètres"
        aria-hidden="true"
        inert>
        <div class="contacts-sidebar-header">
            <h2>Paramètres</h2>
            <button
                type="button"
                id="settings-close"
                class="settings-close"
                aria-label="Fermer les paramètres">×</button>
        </div>
        <iframe src="parametres.html" title="Réglages de la messagerie"></iframe>
    </aside>
</body>
</html>
